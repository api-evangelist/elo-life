description: >-
  Elo Life Systems is a next-generation food and agriculture company based in Research Triangle
  Park, North Carolina, using molecular farming and gene-editing to turn high-yield crops into
  biofactories for natural food ingredients. Its lead product is a low-calorie, high-potency
  natural sweetener inspired by monk fruit that is designed to taste like sugar while replacing
  both sugar and artificial sweeteners at a lower cost. Elo also partners with Dole to develop a
  fungus-resistant (TR4/Fusarium wilt) Cavendish banana. Backed by DCVC Bio and Novo Holdings,
  the company raised an oversubscribed $20.5M Series A2 to scale its molecular-farming platform.
  Elo Life is a food-tech / agricultural-biotech company and does not currently publish a public
  developer API; this profile captures its identity and public web properties.
